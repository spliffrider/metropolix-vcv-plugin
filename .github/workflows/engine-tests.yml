name: Engine tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [SequencerTests, ManualConformanceTests, AccumulatorTests, ModulationTests, AuxTests, ControlTests, PresetTests, ChainTests, SwingTests, OverrideTests, LoopyTests, ScaleTests, SlideTests, StageCvTests, ClockOutputTests, OutputRoutingTests, TrackOptionsTests, AccumulatorRoutingTests, ExtendedRoutingTests, ClockConfigTests, WorkflowTests, SetupTimingTests, PickupTests, MidiTests, MxTests]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build engine test
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p build/tests
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic -pthread "tests/$SUITE.cpp" -o "build/tests/$SUITE"
      - name: Run engine test
        env:
          SUITE: ${{ matrix.suite }}
        run: '"build/tests/$SUITE"'
